name: Wizzo

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Secrets.xcconfig (gitignored, copy from Secrets.example.xcconfig) supplies
# SUPABASE_URL/SUPABASE_ANON_KEY as build settings, the same split as
# wizard/frontend/.env.example - real values never land in source control.
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # Community-maintained binary distribution of Google's own compiled
  # WebRTC (no official SPM package exists - Google deprecated their own
  # mobile binary distribution, see docs/IOS.md) - verified against the
  # actual bundled headers of this exact pinned version before writing any
  # Swift code against it.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 155.0.0

targets:
  Wizzo:
    type: application
    platform: iOS
    sources:
      - Wizzo
      # Explicit folder reference (type: folder) overrides the generic
      # sweep above for this one path - without it XcodeGen would add each
      # .webp individually and flatten them into the bundle root, breaking
      # Card+Art.swift's Bundle lookup, which expects an actual "Cards"
      # subdirectory to still exist inside the compiled app bundle.
      - path: Wizzo/Resources/Cards
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.wizzo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Lokal/im Simulator per Automatic signiert (Xcode wählt Team/Profil
        # selbst). Der TestFlight-Workflow (ci/testflight.sh) schaltet das
        # vor dem Archivieren per sed auf Manual mit einem frisch über die
        # App-Store-Connect-API erzeugten Zertifikat/Profil um.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
    # "development" here is correct for every Xcode/TestFlight-internal
    # build - Xcode rewrites it to "production" automatically at archive
    # time for TestFlight-external/App Store builds (standard Apple
    # tooling behavior, not something this file needs to branch on).
    entitlements:
      path: Wizzo/Wizzo.entitlements
      properties:
        aps-environment: development
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Wizzo
        # Ohne diese beiden expliziten Einträge landen MARKETING_VERSION/
        # CURRENT_PROJECT_VERSION aus den Target-Settings oben NICHT in der
        # kompilierten Info.plist - Xcode injiziert CFBundleShortVersionString/
        # CFBundleVersion nur automatisch bei GENERATE_INFOPLIST_FILE=YES
        # (volle Auto-Generierung), nicht bei einer eigenen Info.plist-Datei
        # wie hier. Ohne das landeten bisher Xcodes eigene Projekt-Defaults
        # "1.0"/"1" im Build statt unserer Werte - echte Ursache dafür, dass
        # testflight.sh's Build-Nummer-Bump (CURRENT_PROJECT_VERSION) wirkungslos
        # blieb und jeder Upload Apples "bereits verwendete Version"-Konflikt
        # auslöste, sobald der vorherige Build 1 einmal gültig durchkam.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Voice chat later needs this - adding it now so a getUserMedia-
        # equivalent native call never silently crashes the app for lack of
        # a usage string (see docs/IOS.md).
        NSMicrophoneUsageDescription: "Wizzo benötigt Mikrofonzugriff für den optionalen Sprachchat während einer Partie."
        # Wizzo nutzt nie Video/Kamera (reiner Audio-Sprachchat, siehe
        # docs/IOS.md) - das gelinkte stasel/WebRTC-Framework referenziert
        # aber Kamera-APIs (für WebRTC-Videoanrufe allgemein), was Apples
        # statische Prüfung unabhängig von der tatsächlichen Nutzung als
        # "Missing purpose string" zurückweist (ITMS-90683, echte Ablehnung
        # eines App-Store-Connect-Uploads beim ersten TestFlight-Build).
        NSCameraUsageDescription: "Wizzo verwendet keine Kamera. Dieser Hinweis wird vom verwendeten WebRTC-Framework benötigt, das allgemein Video-fähig ist, obwohl Wizzo nur Audio-Sprachchat nutzt."
        # Lets a voice chat already in progress keep sending/receiving audio
        # while the app is backgrounded - the actual reason this whole app
        # is native instead of a PWA wrapper (see docs/IOS.md).
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: WebRTC
        product: WebRTC
